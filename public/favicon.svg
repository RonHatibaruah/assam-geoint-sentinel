<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" />

  <!-- Subtle Radial Radar Pulse Rings -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#6ee7b7" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.3" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="#a7f3d0" stroke-width="0.75" opacity="0.4" />
  
  <!-- Stylized Earth Curvature Arc -->
  <path d="M 12 48 Q 32 38 52 48" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Satellite Body & Solar Arrays -->
  <g transform="translate(32,28) rotate(-28)">
    <!-- Central Sensor Core -->
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#ffffff" stroke="#065f46" stroke-width="1" />
    <circle cx="0" cy="0" r="2.5" fill="#059669" />

    <!-- Solar Panels -->
    <!-- Left Panel -->
    <line x1="-5" y1="0" x2="-16" y2="0" stroke="#f1f5f9" stroke-width="1.2" />
    <rect x="-16" y="-4" width="10" height="8" rx="1" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" opacity="0.95" />
    <line x1="-11" y1="-4" x2="-11" y2="4" stroke="#ffffff" stroke-width="0.6" opacity="0.7" />

    <!-- Right Panel -->
    <line x1="5" y1="0" x2="16" y2="0" stroke="#f1f5f9" stroke-width="1.2" />
    <rect x="6" y="-4" width="10" height="8" rx="1" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" opacity="0.95" />
    <line x1="11" y1="-4" x2="11" y2="4" stroke="#ffffff" stroke-width="0.6" opacity="0.7" />

    <!-- Downward Radar Cone Pulse -->
    <path d="M 0 5 L -8 18 L 8 18 Z" fill="url(#accentGrad)" opacity="0.35" />
    <path d="M -5 14 Q 0 16 5 14" fill="none" stroke="#fef08a" stroke-width="1" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Pulsing Sentinel Indicator Light -->
  <circle cx="48" cy="16" r="3" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="48" cy="16" r="1.5" fill="#ffffff" />
</svg>
