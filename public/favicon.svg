<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sleek Charcoal / Metallic Grey Theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="silverAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>
    <linearGradient id="radarCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Silver Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#6b7280" stroke-width="1.5" />

  <!-- Subtle Radial Radar Pulse Rings in Silver -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#9ca3af" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.35" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="#d1d5db" stroke-width="0.75" opacity="0.4" />
  
  <!-- Stylized Earth Curvature Arc in Platinum Silver -->
  <path d="M 12 48 Q 32 38 52 48" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Satellite Body & Solar Arrays in Chrome/Silver with Emerald Radar Pulse -->
  <g transform="translate(32,28) rotate(-28)">
    <!-- Central Sensor Core -->
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#f3f4f6" stroke="#4b5563" stroke-width="1" />
    <circle cx="0" cy="0" r="2.5" fill="#10b981" />

    <!-- Solar Panels -->
    <!-- Left Panel -->
    <line x1="-5" y1="0" x2="-16" y2="0" stroke="#d1d5db" stroke-width="1.2" />
    <rect x="-16" y="-4" width="10" height="8" rx="1" fill="#475569" stroke="#9ca3af" stroke-width="0.8" opacity="0.95" />
    <line x1="-11" y1="-4" x2="-11" y2="4" stroke="#e2e8f0" stroke-width="0.6" opacity="0.8" />

    <!-- Right Panel -->
    <line x1="5" y1="0" x2="16" y2="0" stroke="#d1d5db" stroke-width="1.2" />
    <rect x="6" y="-4" width="10" height="8" rx="1" fill="#475569" stroke="#9ca3af" stroke-width="0.8" opacity="0.95" />
    <line x1="11" y1="-4" x2="11" y2="4" stroke="#e2e8f0" stroke-width="0.6" opacity="0.8" />

    <!-- Downward Radar Cone Pulse -->
    <path d="M 0 5 L -8 18 L 8 18 Z" fill="url(#radarCone)" opacity="0.4" />
    <path d="M -5 14 Q 0 16 5 14" fill="none" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" opacity="0.95" />
  </g>

  <!-- Pulsing Sentinel Indicator Light -->
  <circle cx="48" cy="16" r="3" fill="#10b981" filter="url(#glow)" />
  <circle cx="48" cy="16" r="1.5" fill="#ffffff" />
</svg>
